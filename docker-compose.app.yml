services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.7
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      - UPTIME_KUMA_DB_TYPE=mariadb
      - UPTIME_KUMA_DB_HOSTNAME=mariadb
      - UPTIME_KUMA_DB_PORT=3306
      - UPTIME_KUMA_DB_NAME=${MARIADB_DATABASE}
      - UPTIME_KUMA_DB_USERNAME=${MARIADB_USER}
      - UPTIME_KUMA_DB_PASSWORD=${MARIADB_PASSWORD}
      - UPTIME_KUMA_HOST=0.0.0.0
      - UPTIME_KUMA_PORT=3001
      - TZ=Europe/Moscow
    volumes:
      - kuma-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro 
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  mariadb:
    image: mariadb:11.4
    container_name: mariadb
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${MARIADB_DATABASE}
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
      - TZ=Europe/Moscow
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mariadb-exporter:
    image: prom/mysqld-exporter:v0.14.0
    container_name: mariadb-exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=${EXPORTER_USER}:${EXPORTER_PASSWORD}@(mariadb:3306)/
    depends_on:
      mariadb:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mariadb-data:
  kuma-data:

networks:
  default:
    name: monitoring_net